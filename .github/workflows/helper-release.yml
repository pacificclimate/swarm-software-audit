name: Host helper release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing numeric tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Publish versioned helpers without replacing existing assets
        run: |
          python3 scripts/release_assets.py
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
